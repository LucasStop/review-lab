name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck · Lint · Formato · Segredos
    runs-on: ubuntu-latest
    steps:
      # Histórico completo: o gitleaks varre os commits do PR.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: yarn install

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Formato
        run: yarn format:check

      - name: Segredos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sem testes ainda: nenhum código de regra de negócio existe. Entra com
      # `yarn test` quando chegarem hash, sanitizador e parser do Link.
