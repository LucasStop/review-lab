name: Cost probe

on:
  pull_request_target:
    branches: ['*']

permissions: write-all

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: echo "${{ github.event.pull_request.title }}"
