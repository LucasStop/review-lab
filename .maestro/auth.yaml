# C57, C07, C51, C01, C06, C04: Sair pede confirmação e Cancelar mantém a sessão, Sair volta ao
# Login, login obrigatório, cadastro entra logado, sessão sobrevive ao reabrir, senha errada.
# E-mail novo a cada execução: o cadastro recusa e-mail repetido. Precisa do Metro (ver README.md).
appId: host.exp.Exponent
name: auth
---
# Começa logado (sessão anterior ou cadastro novo) para testar o Sair pelo Perfil.
- runFlow: subflows/session.yaml
- tapOn:
    id: 'catalog.profile'
- extendedWaitUntil:
    visible:
      id: 'profile.logout'
    timeout: 10000
# C57: Cancelar fecha o diálogo e mantém a sessão e a tela.
- tapOn:
    id: 'profile.logout'
- tapOn:
    id: 'profile.cancel'
- extendedWaitUntil:
    notVisible: 'Sair da conta?'
    timeout: 5000
- assertVisible:
    id: 'profile.email'
- assertNotVisible:
    id: 'login.screen'
# C07: confirmar o Sair volta ao Login.
- tapOn:
    id: 'profile.logout'
- tapOn:
    id: 'profile.confirm'
- extendedWaitUntil:
    visible:
      id: 'login.screen'
    timeout: 10000
# C51: sem sessão, reabrir o app cai no Login e não chega ao Catálogo.
- runFlow: subflows/open-app.yaml
- extendedWaitUntil:
    visible:
      id: 'login.screen'
    timeout: 90000
- assertNotVisible:
    id: 'catalog.profile'
# C01: cadastro válido entra logado.
- evalScript: ${output.email = 'e2e' + Date.now() + '@exemplo.com'}
- tapOn:
    id: 'login.signup'
- tapOn:
    id: 'signup.email'
- inputText: ${output.email}
- tapOn:
    id: 'signup.password'
- inputText: 'segredo123'
- tapOn:
    id: 'signup.submit'
- extendedWaitUntil:
    visible:
      id: 'catalog.profile'
    timeout: 20000
# C06: fechar e reabrir mantém a sessão.
- runFlow: subflows/open-app.yaml
- extendedWaitUntil:
    visible:
      id: 'catalog.profile'
    timeout: 90000
# C04: sair pelo Perfil e errar a senha mostra a mensagem única.
- tapOn:
    id: 'catalog.profile'
- tapOn:
    id: 'profile.logout'
- tapOn:
    id: 'profile.confirm'
- extendedWaitUntil:
    visible:
      id: 'login.screen'
    timeout: 10000
- tapOn:
    id: 'login.email'
- inputText: ${output.email}
- tapOn:
    id: 'login.password'
- inputText: 'errada123'
- tapOn:
    id: 'login.submit'
- extendedWaitUntil:
    visible: 'E-mail ou senha incorretos.'
    timeout: 10000
