# C31, C32, C65: busca pelo botão Buscar, termo sem resultado, campo vazio volta à lista e o
# resultado tocado abre o detalhe. Gasta 2 buscas (limite de 10 por minuto sem token) e o
# detalhe de 1 PR. Precisa do Metro (ver README.md).
appId: host.exp.Exponent
name: search
---
- runFlow: subflows/session.yaml
- extendedWaitUntil:
    visible:
      id: 'catalog.card.0'
    timeout: 30000
# C32: termo sem resultado avisa e diz o termo.
- tapOn:
    id: 'catalog.search-input'
- inputText: 'zzzqqq'
- tapOn:
    id: 'catalog.search-submit'
- extendedWaitUntil:
    visible: 'Nenhum resultado para “zzzqqq”'
    timeout: 30000
# C65: Buscar com o campo vazio volta à lista paginada.
- tapOn:
    id: 'catalog.search-input'
- eraseText: 10
- tapOn:
    id: 'catalog.search-submit'
- extendedWaitUntil:
    visible:
      id: 'catalog.card.0'
    timeout: 30000
# C31: o resultado é uma lista, não o primeiro PR aberto direto; tocar abre o detalhe.
- tapOn:
    id: 'catalog.search-input'
- inputText: 'fix'
- tapOn:
    id: 'catalog.search-submit'
# O card 0 da lista paginada fica na tela até a busca começar: espera o loader sair antes.
- extendedWaitUntil:
    visible:
      id: 'loading'
    timeout: 5000
    optional: true
- extendedWaitUntil:
    notVisible:
      id: 'loading'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'catalog.card.0'
    timeout: 30000
- assertNotVisible:
    id: 'detail.title'
- tapOn:
    id: 'catalog.card.0'
- extendedWaitUntil:
    visible:
      id: 'detail.title'
    timeout: 30000
