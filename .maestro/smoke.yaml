# C50: o app abre no Expo Go sem tela vermelha. Precisa do Metro em localhost:8081 (ver README.md).
appId: host.exp.Exponent
name: smoke
---
- runFlow: subflows/open-app.yaml
# Sem sessão abre no Login; com sessão salva, direto no Catálogo.
- extendedWaitUntil:
    visible:
      id: 'login\.screen|catalog\.list'
    timeout: 90000
- assertNotVisible: 'Render Error'
