# C15: tocar no card abre o detalhe com título, estatísticas e corpo.
# Gasta requisições da API do GitHub (60 por hora sem token). Precisa do Metro (ver README.md).
appId: host.exp.Exponent
name: detail
---
- runFlow: subflows/session.yaml
- extendedWaitUntil:
    visible:
      id: 'catalog.card.0'
    timeout: 30000
- tapOn:
    id: 'catalog.card.0'
- extendedWaitUntil:
    visible:
      id: 'detail.title'
    timeout: 30000
- assertVisible:
    id: 'detail.stats'
- assertVisible:
    id: 'detail.body'
